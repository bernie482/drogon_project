<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>登入</title>
</head>
<body>
  <h2>登入</h2>

  <!-- 登入失敗顯示錯誤 -->
  <script>
    if (location.search.includes('error=1'))
      document.write('<p style="color:red">帳號或密碼錯誤</p>');
  </script>

  <form method="post" action="/login">
    <label>帳號 <input type="text"     name="username"></label><br>
    <label>密碼 <input type="password" name="password"></label><br>
    <button type="submit">登入</button>
  </form>
</body>
</html>
